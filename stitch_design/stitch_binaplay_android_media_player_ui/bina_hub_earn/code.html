<script class="">
  (function() {
    const sortBtn = document.getElementById('sort-dropdown-btn');
    const sortMenu = document.getElementById('sort-menu');
    const sortChevron = document.getElementById('sort-chevron');
    const sortLabel = document.getElementById('sort-current-label');
    const container = document.getElementById('sort-dropdown-container');

    if (!sortBtn || !sortMenu) return;

    function toggleMenu(open) {
      const isOpen = open !== undefined ? open : sortMenu.classList.contains('hidden');
      if (isOpen) {
        sortMenu.classList.remove('hidden');
        sortMenu.classList.add('flex');
        sortChevron.style.transform = 'rotate(180deg)';
        sortBtn.classList.add('border-primary-container/40', 'bg-surface-container-high');
        sortBtn.setAttribute('aria-expanded', 'true');
      } else {
        sortMenu.classList.add('hidden');
        sortMenu.classList.remove('flex');
        sortChevron.style.transform = 'rotate(0deg)';
        sortBtn.classList.remove('border-primary-container/40', 'bg-surface-container-high');
        sortBtn.setAttribute('aria-expanded', 'false');
      }
    }

    sortBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleMenu();
    });

    document.addEventListener('click', (e) => {
      if (!container.contains(e.target)) {
        toggleMenu(false);
      }
    });

    const options = sortMenu.querySelectorAll('.sort-option');
    options.forEach(option => {
      option.addEventListener('click', (e) => {
        e.stopPropagation();
        const val = option.getAttribute('data-sort-val');
        sortLabel.textContent = val;
        
        options.forEach(opt => {
          const check = opt.querySelector('.check-icon');
          opt.classList.remove('text-primary-container', 'bg-surface-variant/40');
          opt.classList.add('text-on-surface');
          if (check) check.classList.add('hidden');
        });

        option.classList.remove('text-on-surface');
        option.classList.add('text-primary-container', 'bg-surface-variant/40');
        const check = option.querySelector('.check-icon');
        if (check) check.classList.remove('hidden');

        toggleMenu(false);
      });
    });
  })();
</script></body></html>
